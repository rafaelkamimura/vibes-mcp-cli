name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: 1.20
      - name: Tidy modules
        run: go mod tidy
      - name: Lint
        run: |
          go fmt ./...
          go vet ./...
      - name: Run tests
        run: go test ./... -v
      - name: Build binary
        run: go build -o openai-cli