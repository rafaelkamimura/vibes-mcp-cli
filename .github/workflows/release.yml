name: Release
on:
  push:
    tags:
      - 'v*.*.*'
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.20'
      - name: Install dependencies
        run: go mod tidy
      - name: Run tests
        run: go test ./... -v
      - name: Build binaries
        run: |
          mkdir -p dist
          for osarch in linux/amd64 darwin/amd64 windows/amd64; do
            os="${osarch%%/*}"
            arch="${osarch##*/}"
            ext=""
            if [ "$os" = "windows" ]; then ext=".exe"; fi
            output="dist/openai-cli-${os}-${arch}${ext}"
            echo "Building $output"
            GOOS=$os GOARCH=$arch go build -ldflags='-s -w' -o "$output" .
          done
      - name: Publish Release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}